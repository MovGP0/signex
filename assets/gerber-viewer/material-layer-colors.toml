# Default Gerber layer-slot palette.
# These are Material Design colors and are intentionally independent of the GUI theme.
# The source palette supplies slot order and HSL matching inputs only; its RGB values are not stored here.
# Distance = sqrt((circular hue delta / 180 * average saturation)^2
#               + saturation delta^2 + lightness delta^2).

version = 1
color_space = "hsl"
palette_sources = [
  "https://htmlcolorcodes.com/color-chart/material-design-color-chart/",
  "https://www.materialpalette.com/colors",
]

# Material Blue Grey 400, used only for revealing clear-polarity objects.
